<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL 4-Weeks Challenge - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #d32f2f; }
        .control-group { margin: 20px 0; padding: 15px; background: #fff; border: 1px solid #ccc; border-radius: 4px; }
        label { font-weight: bold; margin-right: 10px; }
        select { padding: 8px; font-size: 14px; }
        .team-row { display: flex; align-items: center; justify-content: space-between; padding: 8px; background: #fff; border-bottom: 1px solid #eee; }
        .team-row:nth-child(even) { background: #fafafa; }
        .team-label { font-weight: bold; width: 80px; }
        .score-input { width: 80px; padding: 6px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        button { display: block; width: 100%; padding: 15px; background-color: #d32f2f; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #b71c1c; }
        .nav-links { text-align: center; margin-top: 20px; }
        .nav-links a { color: #0056b3; text-decoration: none; margin: 0 10px; }
        .hidden { display: none !important; }
        .card-login { background: #fff; padding: 30px; border-radius: 8px; border: 1px solid #ccc; text-align: center; margin-top: 40px; }
        input[type="password"] { width: 80%; padding: 10px; margin: 15px 0; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
    </style>
</head>
<body>

    <!-- 1. AUTHENTICATION GATE -->
    <div id="loginCard" class="card-login">
        <h1>🔒 Admin Authentication</h1>
        <p>Enter password to access contest controls</p>
        <input type="password" id="adminPasswordInput" placeholder="Admin Password">
        <button id="loginBtn">Authenticate</button>
        <p id="loginError" style="color: #d32f2f; margin-top: 10px; display: none;">Invalid Password</p>
    </div>

    <!-- 2. MAIN ADMIN DASHBOARD (Hidden until authenticated) -->
    <div id="adminContent" class="hidden">
        <h1>🛠️ Admin: NFL First 4-Weeks Challenge</h1>

        <!-- Contest Lock Control -->
        <div class="control-group" style="border-left: 5px solid #2563eb; display: flex; align-items: center; justify-content: space-between;">
            <div>
                <strong>Contest Entry Status:</strong> 
                <span id="entryStatusBadge" style="padding: 4px 8px; border-radius: 4px; font-weight: bold;">Loading...</span>
            </div>
            <button type="button" id="toggleEntriesBtn" style="width: auto; margin-top: 0; padding: 8px 16px; background-color: #2563eb;">Toggle Lock</button>
        </div>
        
        <!-- Week Selector -->
        <div class="control-group">
            <label for="weekSelect">Select Week to Edit:</label>
            <select id="weekSelect">
                <option value="week1_pts">Week 1</option>
                <option value="week2_pts">Week 2</option>
                <option value="week3_pts">Week 3</option>
                <option value="week4_pts">Week 4</option>
            </select>
        </div>

        <!-- Weekly Scores Form -->
        <form id="adminScoreForm">
            <div id="teamsContainer">
                <!-- Team rows dynamically inserted -->
            </div>
            <button type="submit">Save All Weekly Scores</button>
            <hr style="margin-top: 30px; border: 0; border-top: 1px dashed #ccc;">
            <button type="button" id="masterResetBtn" style="background-color: #c62828; margin-top: 10px;">⚠️ Master Reset Contest ⚠️</button>
        </form>

        <!-- Navigation Links -->
        <div class="nav-links">
            <a href="/admin/manage-4w-entries" style="font-weight: bold; color: #d32f2f;">📋 Manage Entries (Paid / Delete)</a> | 
            <a href="/four-weeks-entry">Go to Entry Form</a> | 
            <a href="/four-weeks-leaderboard">Go to Leaderboard →</a>
            <br><br>
            <a href="#" id="logoutBtn" style="color: #666; font-size: 12px;">🔒 Lock Admin Panel (Logout)</a>
        </div>
    </div>

    <script>
        let allTeamScores = [];
        let adminToken = sessionStorage.getItem('adminToken') || '';

        const weekSelect = document.getElementById('weekSelect');
        const container = document.getElementById('teamsContainer');

        // Check token on page load
        if (adminToken) {
            verifyTokenAndLoad();
        }

        // Login Handler
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const pass = document.getElementById('adminPasswordInput').value;
            const token = btoa(pass);

            try {
                const res = await fetch('/api/admin/entry-status', {
                    headers: { 'Authorization': token }
                });

                if (res.ok) {
                    adminToken = token;
                    sessionStorage.setItem('adminToken', token);
                    document.getElementById('loginError').style.display = 'none';
                    showDashboard();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (err) {
                console.error('Authentication error:', err);
                alert('Server connection error during login.');
            }
        });

        // Verify existing session token
        async function verifyTokenAndLoad() {
            try {
                const res = await fetch('/api/admin/entry-status', {
                    headers: { 'Authorization': adminToken }
                });
                if (res.ok) {
                    showDashboard();
                } else {
                    sessionStorage.removeItem('adminToken');
                    adminToken = '';
                }
            } catch (err) {
                console.error('Session validation failed:', err);
            }
        }

        function showDashboard() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            checkEntryStatus();
            fetchScores();
        }

        // Fetch current Lock Status
        async function checkEntryStatus() {
            try {
                const res = await fetch('/api/admin/entry-status', {
                    headers: { 'Authorization': adminToken }
                });
                const data = await res.json();
                const badge = document.getElementById('entryStatusBadge');
                
                if (data.entriesOpen) {
                    badge.innerText = "OPEN";
                    badge.style.backgroundColor = "#dcfce7";
                    badge.style.color = "#15803d";
                } else {
                    badge.innerText = "LOCKED / CLOSED";
                    badge.style.backgroundColor = "#fee2e2";
                    badge.style.color = "#b91c1c";
                }
            } catch (err) {
                console.error("Error fetching status:", err);
            }
        }

        // Toggle Lock Handler
        document.getElementById('toggleEntriesBtn').addEventListener('click', async () => {
            try {
                const currentRes = await fetch('/api/admin/entry-status', {
                    headers: { 'Authorization': adminToken }
                });
                const currentData = await currentRes.json();
                const newState = !currentData.entriesOpen;

                const response = await fetch('/api/admin/entry-status', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify({ entriesOpen: newState })
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    alert(`Entries are now ${newState ? 'OPEN' : 'LOCKED'}`);
                    checkEntryStatus();
                } else {
                    alert("Server rejected update: " + (result.error || result.message || "Unauthorized"));
                }
            } catch (err) {
                console.error("Error toggling entry lock:", err);
                alert("Failed to update entry status.");
            }
        });

        // Fetch scores from server
        async function fetchScores() {
            try {
                const response = await fetch('/api/challenge-scores');
                const data = await response.json();
                if (data.success) {
                    allTeamScores = data.scores;
                    renderWeekScores();
                } else {
                    alert("Error loading scores: " + data.message);
                }
            } catch (err) {
                console.error(err);
                alert("Failed to fetch scores from server.");
            }
        }

        // Render Team Score Inputs
        function renderWeekScores() {
            const selectedWeekKey = weekSelect.value;
            container.innerHTML = '';

            allTeamScores.forEach(team => {
                const currentScore = team[selectedWeekKey] || 0;
                
                const row = document.createElement('div');
                row.className = 'team-row';
                row.innerHTML = `
                    <span class="team-label">${team.team_tri_code}</span>
                    <input type="number" 
                           class="score-input" 
                           data-team="${team.team_tri_code}" 
                           value="${currentScore}" 
                           min="0" 
                           placeholder="0">
                `;
                container.appendChild(row);
            });
        }

        weekSelect.addEventListener('change', renderWeekScores);

        // Save Weekly Scores
        document.getElementById('adminScoreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedWeekKey = weekSelect.value;
            const updatedScores = {};

            document.querySelectorAll('.score-input').forEach(input => {
                const team = input.getAttribute('data-team');
                updatedScores[team] = parseInt(input.value) || 0;
            });

            try {
                const response = await fetch('/api/challenge-save-scores', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': adminToken
                    },
                    body: JSON.stringify({
                        week: selectedWeekKey,
                        scores: updatedScores
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert(result.message);
                    fetchScores();
                } else {
                    alert("Error saving: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Server communication error while saving.");
            }
        });

        // Master Reset
        document.getElementById('masterResetBtn').addEventListener('click', async () => {
            const confirm1 = confirm("WARNING: This will completely delete ALL user entries and wipe all scores back to 0. Are you absolutely sure?");
            if (!confirm1) return;

            const confirm2 = confirm("FINAL WARNING: This cannot be undone. Click OK to wipe the 4-Weeks Challenge data.");
            if (!confirm2) return;

            try {
                const response = await fetch('/api/challenge-master-reset', { 
                    method: 'POST',
                    headers: { 'Authorization': adminToken }
                });
                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    fetchScores();
                } else {
                    alert("Reset failed: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Communication error during master reset.");
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            sessionStorage.removeItem('adminToken');
            location.reload();
        });
    </script>
</body>
</html>
